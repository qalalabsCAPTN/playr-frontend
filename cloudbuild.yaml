steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/streetplayr-production/cloud-run-source-deploy/playr:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/streetplayr-production/cloud-run-source-deploy/playr:latest'
      - '.'

  # 2. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/streetplayr-production/cloud-run-source-deploy/playr:$COMMIT_SHA'

  # 3. Deploy to Cloud Run (Service: playr)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'playr'
      - '--image'
      - 'asia-south1-docker.pkg.dev/streetplayr-production/cloud-run-source-deploy/playr:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'streetplayr-runtime@streetplayr-production.iam.gserviceaccount.com'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--execution-environment'
      - 'gen2'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_PUBLIC_BRAND_ID=playr,NEXT_PUBLIC_SITE_URL=https://playr.in,NEXT_PUBLIC_SUPABASE_URL=https://sayxtpglwjiinnrftifq.supabase.co,NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNheXh0cGdsd2ppaW5ucmZ0aWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODQxMzksImV4cCI6MjA5Mzg2MDEzOX0.NiT5r6z4HABTfP7LXYihnkic8xSLqldEoJ6KK4HLDVU,NEXT_PUBLIC_NECTAR_API_URL=https://nectar-api-1081952187019.asia-south1.run.app,NEXT_PUBLIC_PHONE_PREFIX=+91,UNICOMMERCE_API_URL=https://playr.unicommerce.com,UNICOMMERCE_USERNAME=streetplayr,UNICOMMERCE_FACILITY_CODE=playR_Delhi,UNICOMMERCE_CHANNEL_CODE=CUSTOM,EASEBUZZ_ENV=prod,DEMO_INVENTORY_MODE=false,SMTP_HOST=smtp.gmail.com,SMTP_PORT=465,SMTP_USER=orders@playR.in,TRANSACTIONAL_FROM_EMAIL=playR <orders@playR.in>'
      - '--set-secrets'
      - 'SUPABASE_SERVICE_ROLE_KEY=streetplayr-supabase-service-role:latest,PLATFORM_TOKEN_PLAYR=streetplayr-platform-token:latest,CRON_SECRET=streetplayr-cron-secret:latest,GOOGLE_AI_API_KEY=streetplayr-google-ai-key:latest,UNICOMMERCE_PASSWORD=streetplayr-uniware-password:latest,EASEBUZZ_MERCHANT_KEY=streetplayr-easebuzz-key:latest,EASEBUZZ_SALT=streetplayr-easebuzz-salt:latest,SMTP_PASSWORD=streetplayr-smtp-password:latest'

images:
  - 'asia-south1-docker.pkg.dev/streetplayr-production/cloud-run-source-deploy/playr:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/streetplayr-production/cloud-run-source-deploy/playr:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  COMMIT_SHA: 'latest'
